<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Budget-Builder-SignUp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="center-box"> 
        <div class="form2">
            <h2>Lets get you signed up</h2>
            <form action="save.php" method="POST">
                <input type="text" name="fullname" placeholder="Enter Full Name" required>
                <input type="text" name="surname" placeholder="Enter Surname" required>
                <input type="text" name="idnumber" placeholder="Enter Identity Number" required>
                <input type="tel" name="cell" placeholder="Enter Cell Number" required>
                <input type="tel" name="tel" placeholder="Enter Tel Number" required>
                <input type="email" name="email" placeholder="Enter Email Address" required>
                <input type="password" name="password" placeholder="Create a strong password" required>
                <button class="btnn" type="submit">Register</button> 
            </form>
            <p class="link">Already have an account?<br>
            <a href="page.html">Login Here</a>    
            </p>
        </div>    
    </div>
</body>
</html>
